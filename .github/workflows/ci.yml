name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests (stdlib only, no install needed)
        run: python -m unittest discover -s tests -t . -v
      - name: Smoke-test the CLI end to end
        run: |
          python -m coacheck parse tests/fixtures/coa_clean.txt
          python -m coacheck parse tests/fixtures/coa_clean.txt --json
          python -m coacheck recon --vial 5 --water 2 --dose 250

  # extension/engine/ is a JS port of the Python engine (parser/purity/recon/redflags). This
  # proves it stays in exact numeric and structural agreement with the real coacheck package -
  # see tests/web_parity/ - so the extension can never quietly disagree with the CLI.
  js-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: JS engine + crop-math unit tests
        run: node --test tests/js/*.test.mjs
      - name: Python/JS engine parity
        run: |
          python3 tests/web_parity/gen_fixtures.py
          node tests/web_parity/check.mjs

  web-ext-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npx --yes web-ext@10.5.0 lint --source-dir=extension

  # Everything release.yml does except the upload. The test matrix runs `python -m coacheck`,
  # which never touches [project.scripts], so a broken console script or bad packaging metadata
  # used to only show up at publish time.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Install the wheel and run the installed console script
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/python -m pip install dist/*.whl
          /tmp/v/bin/python -c "import coacheck"
          /tmp/v/bin/coacheck --version
          /tmp/v/bin/coacheck recon --vial 5 --water 2 --dose 250
          /tmp/v/bin/coacheck parse tests/fixtures/coa_clean.txt --recon-water 2 --dose 250
