name: Publish to PyPI

# Triggered by publishing a GitHub Release, not by pushing a tag. A tag can be pushed, moved
# or deleted by mistake; cutting a release is a deliberate act, and it keeps `git tag` free to
# mark a commit without that also shipping a package.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing - no long-lived API token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Install the built wheel and smoke-test it
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/python -m pip install dist/*.whl
          /tmp/v/bin/python -c "import coacheck"
          /tmp/v/bin/coacheck --version
          /tmp/v/bin/coacheck recon --vial 5 --water 2 --dose 250

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
